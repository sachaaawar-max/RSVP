<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="Répondez à l'invitation au mariage d'Aya & Sacha, le 28 mai 2027.">
<meta property="og:title" content="Aya & Sacha · Votre réponse">
<meta property="og:description" content="Merci de nous confirmer votre présence avant le 15 décembre 2026.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RSVP Aya & Sacha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout : une carte-réponse unique posée sur du lin, comme le carton RSVP glissé dans un faire-part papier. Univers papeterie, un seul thème. */
:root {
  --linen: #e4e3dd;
  --ink: #2c2c28;
  --olive: #4a4f33;
  --olive-deep: #3a3e27;
  --gold: #a3775a;
  --muted: #6d6b62;
  --line: #c9c6bb;
  --card: rgba(250,249,245,.9);
  --script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --caps: "Bodoni Moda", "Didot", "Bodoni 72", "Times New Roman", serif;
  --serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.bg { position: fixed; inset: 0; top: 13vh; top: 13svh; z-index: -1; background-color: var(--linen);
  background-image: linear-gradient(180deg, rgba(240,238,232,.55) 0%, rgba(240,238,232,0) 34%, rgba(240,238,232,0) 70%, rgba(240,238,232,.35) 100%), url("media/chateau.jpg");
  background-size: cover; background-position: 50% 45%; }
@media (min-aspect-ratio: 4/3) {
  .bg { top: 190px; background-size: auto, contain; background-repeat: no-repeat; background-position: center top; }
  .names { font-size: 3.4rem !important; } .names small { display: inline !important; margin: 0 .5em !important; }
  body { background-image: none !important; background-color: #f6efe7 !important; } .bg { background-color: #f6efe7; }
  .page { gap: 6px; padding-top: 22px; }
}
body {
  background-color: var(--linen);
  background-image: linear-gradient(rgba(228,227,221,.45), rgba(228,227,221,.45)), url("media/linen.jpg");
  background-size: auto, 240px 600px;
  color: var(--ink); font-family: var(--serif); font-size: 19px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 520px; margin: 0 auto; padding-block: 36px 48px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.seal { width: 58px; height: 58px; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 10px rgba(40,40,30,.3); }
.seal img { width: 100%; height: 100%; object-fit: cover; display: block; }
.caps { font-family: var(--caps); text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; color: var(--ink); }
.names { text-shadow: 0 0 18px rgba(255,255,255,.9), 0 0 4px rgba(255,255,255,.9); font-family: var(--script); font-weight: 400; color: var(--olive); font-size: clamp(3.4rem, 15vw, 4.6rem); line-height: 1.05; margin: 4px 0 0; }
.names small { display: block; font-family: var(--caps); font-size: .7rem; letter-spacing: .2em; color: var(--muted); margin: 2px 0; }
.date, .where { text-shadow: 0 0 10px rgba(255,255,255,.95); }
.date { font-family: var(--caps); text-transform: uppercase; letter-spacing: .1em; color: var(--gold); font-size: .9rem; }
.where { font-style: italic; color: var(--muted); }
.spacer { height: 52vh; height: 52svh; }
.illu-unused { width: 100%; max-width: 440px; height: auto; display: block; margin: 2px 0 -10px;
  -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 52%, #000 62%, transparent 100%);
          mask-image: radial-gradient(ellipse 72% 70% at 50% 52%, #000 62%, transparent 100%); }

.card { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); width: 100%; background: var(--card); border: 1px solid var(--line); padding: 30px 22px 26px; display: flex; flex-direction: column; gap: 18px; text-align: left; box-shadow: 0 20px 40px -30px rgba(40,40,30,.6); }
.card h1 { margin: 0; text-align: center; font-family: var(--script); font-weight: 400; font-size: 3rem; color: var(--olive); line-height: 1; }
.card .lead { text-align: center; margin: -6px 0 2px; }
.f { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.f label, .f legend { font-family: var(--caps); text-transform: uppercase; letter-spacing: .1em; font-size: .64rem; color: var(--muted); padding: 0; }
.f input:not([type=radio]) { width: 100%; font: inherit; font-size: 1.1rem; color: var(--ink); padding: 11px 13px; border: 1px solid var(--line); border-radius: 2px; background: rgba(255,255,255,.85); }
.f input:focus { outline: 2px solid var(--olive); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f label.choice { position: relative; cursor: pointer; font-family: var(--serif); text-transform: none; letter-spacing: 0; font-size: 1rem; color: var(--ink); }
.choice input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.choice span { display: block; text-align: center; font-size: 1.1rem; padding: 11px 8px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.7); color: var(--ink); }
.choice input:checked + span { background: var(--olive); border-color: var(--olive); color: #f4f2ea; }
.choice input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
.when-yes { display: flex; flex-direction: column; gap: 18px; }
form.no .when-yes { display: none; }
.send { align-self: center; margin-top: 4px; font-family: var(--caps); text-transform: uppercase; letter-spacing: .16em; font-size: .74rem; color: #f4f2ea; background: var(--olive); border: 0; border-radius: 999px; padding: 15px 30px; cursor: pointer; }
.send:hover { background: var(--olive-deep); }
.send:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.send[disabled] { opacity: .6; cursor: default; }
.err { color: #8a3b2e; font-style: italic; text-align: center; }
.done { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 10px 0; }
.done .thanks { font-family: var(--script); font-size: 3.2rem; color: var(--olive); line-height: 1; }
.done img { width: min(100%, 260px); height: auto; -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 60%, transparent 100%); mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 60%, transparent 100%); }
.again { background: none; border: 0; cursor: pointer; font-family: var(--caps); text-transform: uppercase; letter-spacing: .14em; font-size: .66rem; color: var(--muted); padding: 8px; }
.foot { background: rgba(250,249,245,.85); padding: 10px 14px; margin-top: 18px; font-size: .95rem; color: var(--muted); }
.foot a { color: var(--olive); white-space: nowrap; }
@media (max-width: 380px) { .choices { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) {
  .page > * { animation: rise .9s ease both; }
  .page > :nth-child(2) { animation-delay: .1s; } .page > :nth-child(3) { animation-delay: .2s; } .page > :nth-child(4) { animation-delay: .3s; }
  @keyframes rise { from { opacity: .001; transform: translateY(8px); } }
}
</style>

</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="page">
  <p class="names">Aya<small>et</small>Sacha</p>
  <span class="date">Vendredi 28 mai 2027</span>
  <span class="where">Château de Nainville-les-Roches</span>
  <div class="spacer" aria-hidden="true"></div>

  <div class="card">
    <form id="rsvp" novalidate>
      <div style="display:flex;flex-direction:column;gap:18px">
        <h1>Répondez</h1>
        <p class="caps lead">merci de nous confirmer votre présence<br>avant le 15 décembre 2026</p>
        <div class="f"><label for="r-name">Prénom et nom</label><input id="r-name" autocomplete="name" required></div>
        <fieldset class="f">
          <legend>Serez-vous présent(e) ?</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="presence" value="Oui"><span>Oui, avec joie</span></label>
            <label class="choice"><input type="radio" name="presence" value="Non"><span>Non, à regret</span></label>
          </div>
        </fieldset>
        <div class="when-yes">
          <div class="row2">
            <div class="f"><label for="r-adults">Adultes</label><input id="r-adults" type="number" min="1" max="20" value="1" inputmode="numeric"></div>
            <div class="f"><label for="r-kids">Enfants</label><input id="r-kids" type="number" min="0" max="20" value="0" inputmode="numeric"></div>
          </div>
          <div class="f"><label for="r-diet">Allergies ou régime alimentaire</label><input id="r-diet" placeholder="Facultatif"></div>
        </div>
        <button class="send" id="r-send" type="submit">Envoyer ma réponse</button>
        <span class="err" id="r-err" role="alert" hidden></span>
      </div>
    </form>
    <div class="done" id="r-done" hidden>
      <span class="thanks">Merci !</span>
      <p id="r-done-text">Votre réponse a bien été transmise à Aya et Sacha.</p>
      <img src="media/couple.jpg" alt="">
      <button class="again" id="r-again" type="button">modifier ma réponse</button>
    </div>
  </div>

</div>

<script>
(function () {
  /* Formulaire Google qui reçoit les réponses (identifiants à compléter avec le lien prérempli) */
  const GFORM = {
    action: "https://docs.google.com/forms/d/e/1FAIpQLSeZcf-wOji6UD3bGNhKBq--DXfgUn66c4zgc6vW-kbXGh4L1Q/formResponse",
    nom: "937334651", presence: "777409597", adultes: "189457126", enfants: "2024173940", regime: "281658748"
  };
  const form = document.getElementById("rsvp"), done = document.getElementById("r-done");
  const err = document.getElementById("r-err"), send = document.getElementById("r-send");
  const val = id => document.getElementById(id).value.trim();
  const presence = () => (form.querySelector('input[name="presence"]:checked') || {}).value;
  form.addEventListener("change", () => form.classList.toggle("no", presence() === "Non"));
  document.getElementById("r-again").addEventListener("click", () => { done.hidden = true; form.hidden = false; });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.hidden = true;
    const p = presence();
    if (!val("r-name")) { err.textContent = "Merci d'indiquer votre prénom et votre nom."; err.hidden = false; return; }
    if (!p) { err.textContent = "Merci d'indiquer si vous serez présent(e)."; err.hidden = false; return; }
    const data = { nom: val("r-name"), presence: p, adultes: p === "Oui" ? val("r-adults") : "0", enfants: p === "Oui" ? val("r-kids") : "0", regime: p === "Oui" ? val("r-diet") : "" };
    if (!GFORM.nom) { err.textContent = "Les réponses ne sont pas encore ouvertes. Merci de réessayer un peu plus tard."; err.hidden = false; return; }
    send.disabled = true; send.textContent = "Envoi…";
    try {
      const body = new URLSearchParams();
      for (const k of ["nom", "presence", "adultes", "enfants", "regime"]) if (GFORM[k]) body.append("entry." + GFORM[k], data[k]);
      await fetch(GFORM.action, { method: "POST", mode: "no-cors", body });
      document.getElementById("r-done-text").textContent = p === "Oui"
        ? "Votre réponse a bien été transmise. Nous avons hâte de célébrer ce jour avec vous !"
        : "Votre réponse a bien été transmise. Vous nous manquerez, merci de nous avoir prévenus.";
      form.hidden = true; done.hidden = false;
    } catch (x) {
      err.textContent = "L'envoi n'a pas fonctionné. Vérifiez votre connexion et réessayez."; err.hidden = false;
    }
    send.disabled = false; send.textContent = "Envoyer ma réponse";
  });
})();
</script>

</body>
</html>
